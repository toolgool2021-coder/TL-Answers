<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TL Answers</title><style>
:root{color-scheme:dark;--bg:#0c0d15;--panel:#171925;--ink:#f4f4ff;--accent:#a9a0ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px system-ui}body.light{color-scheme:light;--bg:#f3f4fa;--panel:white;--ink:#202035;--accent:#5143b5}main,header,nav{max-width:780px;margin:auto;padding:18px}header{display:flex;justify-content:space-between;align-items:center}h1{margin:0;letter-spacing:-1px}small{opacity:.65}section,article{background:var(--panel);border:1px solid #8882;border-radius:20px;padding:20px;margin-bottom:12px}input,textarea,button,select{font:inherit;border:1px solid #8884;border-radius:12px;padding:12px;background:var(--panel);color:var(--ink)}input,textarea{width:100%;margin:5px 0}button{cursor:pointer}button.primary{background:var(--accent);color:var(--bg);font-weight:bold}nav{position:sticky;bottom:0;background:var(--bg);display:flex;gap:6px;overflow:auto}nav button{flex:1}img{max-width:100%;border-radius:12px}p{white-space:pre-wrap;overflow-wrap:anywhere} [hidden]{display:none!important}main{padding-bottom:80px}button:hover{border-color:var(--accent)}
</style><header><div><h1>TL Answers</h1><small>CLASSROOM / 1.0</small></div><button id="theme">◐</button></header><main><section id="login"><h2>Вход в класс</h2><input id="name" placeholder="Имя"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Пароль"><button id="sign" class="primary">Войти</button> <button id="reg">Регистрация</button></section><section id="wait" hidden></section><button id="exitWait" hidden>Выйти</button><p id="error" role="status"></p><div id="app" hidden><section id="feed"><h2>Материалы</h2><input id="search" placeholder="Поиск"><div id="posts"></div></section><section id="chat" hidden><h2>Общий чат</h2><div id="messages"></div><input id="message" maxlength="500" placeholder="Сообщение"><button id="send">Отправить</button></section><section id="questions" hidden><h2>Вопросы</h2><textarea id="question" maxlength="1000" placeholder="Ваш вопрос"></textarea><button id="ask">Задать вопрос</button><div id="answers"></div></section><section id="admin" hidden><h2>Управление</h2><h3>Новый учебный материал</h3><input id="subject" placeholder="Предмет"><textarea id="body" placeholder="Разбор прошедшей работы"></textarea><input id="photo" type="file" accept="image/*"><button id="publish">Опубликовать</button><h3>Заявки</h3><div id="users"></div></section></div></main><nav id="nav" hidden><button data-tab="feed">Лента</button><button data-tab="chat">Чат</button><button data-tab="questions">Вопросы</button><button data-tab="admin" id="adminTab" hidden>Админ</button><button id="logout">Выход</button></nav><script type="module">

import {getDatabase,ref,set,push,onValue,serverTimestamp,update,remove} from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-database.js';
const app=initializeApp({apiKey:"AIzaSyCF_jEG2NFa22Ac_qQFOBBKF5iKDiihL9c",authDomain:"tl-answers.firebaseapp.com",projectId:"tl-answers",databaseURL:"https://tl-answers-default-rtdb.firebaseio.com/",appId:"1:362638707786:web:2513c999c8ed0b48ef6ab3"}),auth=getAuth(app),db=getDatabase(app),owner="dLMJYKdfMoZUMYOablhE8uMn2HB2",$=id=>document.getElementById(id),r=p=>ref(db,p);let me,profile,subs=[],posts={};const guard=fn=>async()=>{try{$('error').textContent='';await fn()}catch(e){$('error').textContent=e.message}};const listen=(p,fn)=>subs.push(onValue(r(p),s=>fn(s.val()||{}),e=>$('error').textContent=e.message));const el=(tag,t)=>{const n=document.createElement(tag);n.textContent=t;return n};const card=(root,title,body)=>{const a=el('article','');a.append(el('strong',title),el('p',body));root.append(a);return a};const btn=(a,t,f)=>{const b=el('button',t);b.onclick=guard(f);a.append(b)};function render(){const root=$('posts');root.replaceChildren();Object.entries(posts).sort((a,b)=>b[1].time-a[1].time).filter(([k,v])=>(v.subject+' '+v.body).toLowerCase().includes($('search').value.toLowerCase())).forEach(([k,v])=>{const a=card(root,v.subject,v.body);a.append(el('small',new Date(v.time).toLocaleString()));if(v.photo&&v.photo.startsWith('data:image/jpeg;base64,')){const i=document.createElement('img');i.src=v.photo;a.append(i)}if(me.uid===owner)btn(a,'Удалить',()=>remove(r('posts/'+k)))})}
$('search').oninput=render;$('theme').onclick=()=>document.body.classList.toggle('light');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>['feed','chat','questions','admin'].forEach(t=>$(t).hidden=t!==b.dataset.tab));$('sign').onclick=guard(()=>signInWithEmailAndPassword(auth,$('email').value,$('password').value));$('reg').onclick=guard(async()=>{const name=$('name').value.trim();if(!name||name.length>80)throw Error('Введите имя');const u=await createUserWithEmailAndPassword(auth,$('email').value,$('password').value);await set(r('users/'+u.user.uid),{name,status:'pending'})});$('logout').onclick=$('exitWait').onclick=guard(()=>signOut(auth));
let offset=0;onValue(r('.info/serverTimeOffset'),s=>offset=s.val()||0);let profileOff;onAuthStateChanged(auth,u=>{subs.splice(0).forEach(f=>f());if(profileOff)profileOff();me=u;$('login').hidden=!!u;$('app').hidden=$('nav').hidden=true;$('wait').hidden=true;$('exitWait').hidden=!u;if(!u)return;profileOff=onValue(r('users/'+u.uid),s=>{subs.splice(0).forEach(f=>f());profile=s.val();const admin=u.uid===owner,ok=admin||profile?.status==='approved';$('wait').hidden=ok;$('exitWait').hidden=ok;$('wait').textContent=(profile?.status==='banned'||profile?.status==='rejected')?'Доступ закрыт':'Ожидайте одобрения владельца.';$('app').hidden=$('nav').hidden=!ok;$('adminTab').hidden=!admin;if(!ok){['posts','messages','answers','users'].forEach(id=>$(id).replaceChildren());window.mine=window.allQuestions=window.publicAnswers={};return;}listen('posts',v=>{posts=v;render()});listen('chat',v=>{$('messages').replaceChildren();Object.values(v).flatMap(x=>Object.values(x)).filter(m=>m && m.text).sort((a,b)=>a.time-b.time).slice(-100).forEach(m=>card($('messages'),m.uid===owner?'OWNER':'Участник',m.text))});listen('publicAnswers',v=>{window.publicAnswers=v;renderAnswers()});listen('questions/'+u.uid,v=>{window.mine=v;renderAnswers()});if(admin){listen('users',v=>{$('users').replaceChildren();Object.entries(v).forEach(([id,p])=>{const a=card($('users'),p.name,p.status);['approved','rejected','banned'].forEach(status=>btn(a,status,()=>update(r('users/'+id),{status})))})});listen('questions',v=>{window.allQuestions=v;renderAnswers()})}})});
function renderAnswers(){const root=$('answers');root.replaceChildren();Object.values(window.publicAnswers||{}).forEach(q=>card(root,q.text,q.answer));Object.values(window.mine||{}).forEach(q=>card(root,q.text,q.answer||'Ожидает ответа'));if(me?.uid===owner)Object.entries(window.allQuestions||{}).forEach(([uid,qs])=>Object.entries(qs).forEach(([id,q])=>{if(q.answer)return;const a=card(root,'Входящий вопрос',q.text),i=document.createElement('textarea');a.append(i);for(const pub of [false,true])btn(a,pub?'Публично':'Лично',async()=>{if(!i.value.trim())return;const changes={};changes['questions/'+uid+'/'+id+'/answer']=i.value;if(pub)changes['publicAnswers/'+id]={text:q.text,answer:i.value};await update(r(''),changes)})}))}
$('send').onclick=guard(async()=>{const text=$('message').value.trim();if(!text)return;const slot=Math.floor((Date.now()+offset)/5000)*5000;await set(r('chat/'+me.uid+'/'+slot),{uid:me.uid,text,time:serverTimestamp()});$('message').value=''});$('ask').onclick=guard(async()=>{const text=$('question').value.trim();if(!text)return;await push(r('questions/'+me.uid),{text,time:serverTimestamp()});$('question').value=''});$('publish').onclick=guard(async()=>{const subject=$('subject').value.trim(),body=$('body').value.trim();if(!subject||!body)throw Error('Заполните поля');let photo='';const f=$('photo').files[0];if(f){const b=await createImageBitmap(f),c=document.createElement('canvas'),scale=Math.min(1,1200/Math.max(b.width,b.height));c.width=b.width*scale;c.height=b.height*scale;c.getContext('2d').drawImage(b,0,0,c.width,c.height);photo=c.toDataURL('image/jpeg',.65);if(photo.length>500000)throw Error('Фото слишком большое')}await push(r('posts'),{subject,body,photo,time:serverTimestamp()});$('subject').value=$('body').value=$('photo').value=''});
</script></html>
